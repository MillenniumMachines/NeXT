on:
  push:
    tags:
      - 'v*'

name: Build and Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build nxt
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout nxt only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify semver release tag
        run: |
          chmod +x dist/verify-release-tag.sh
          dist/verify-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Resolve release version
        run: |
          set -euo pipefail
          # shellcheck source=dist/resolve-build-version.sh
          source dist/resolve-build-version.sh
          echo "BUILD_REF=${BUILD_REF}" >> "${GITHUB_ENV}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "${GITHUB_ENV}"
          echo "Resolved tag ${GITHUB_REF_NAME} → BUILD_REF=${BUILD_REF} BUILD_VERSION=${BUILD_VERSION} (sha ${BUILD_SHA})"

      - name: Fetch DWC build sources (read-only tarball)
        run: |
          chmod +x dist/ci-fetch-dwc.sh
          dist/ci-fetch-dwc.sh

      - name: Check RRF macro line lengths
        run: node dist/check-gcode-line-length.mjs

      - name: Check M98 must not invoke numbered M/G macros
        run: node dist/check-m98-numbered-meta.mjs

      - name: Check G6512 single-axis call contract
        run: node dist/check-g6512-axis-contract.mjs

      - name: Check G6512 deflection compensation math
        run: node dist/check-g6512-deflection-math.mjs

      - name: Check OM global size budget
        run: node dist/check-om-global-budget.mjs

      - name: Build release asset
        run: |
          command -v rsync >/dev/null 2>&1 || {
            apt-get update && apt-get install -y rsync;
          }
          dist/release.sh "${{ github.workspace }}/dwc-build"

      - name: Load build manifest
        run: |
          set -euo pipefail
          if [[ ! -f dist/build-version.env ]]; then
            echo "::error::dist/build-version.env missing after release.sh" >&2
            exit 1
          fi
          set -a
          # shellcheck source=/dev/null
          source dist/build-version.env
          set +a
          for key in NXT_BUILD_VERSION NXT_RELEASE_ZIP NXT_PP_CPS NXT_PP_PY NXT_PP_MACHINE_PY NXT_PP_MACHINES_DIR NXT_PP_MCH; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::${key} not set in build-version.env" >&2
              exit 1
            fi
          done
          {
            echo "NXT_BUILD_VERSION=${NXT_BUILD_VERSION}"
            echo "NXT_RELEASE_ZIP=${NXT_RELEASE_ZIP}"
            echo "NXT_PP_CPS=${NXT_PP_CPS}"
            echo "NXT_PP_PY=${NXT_PP_PY}"
            echo "NXT_PP_MACHINE_PY=${NXT_PP_MACHINE_PY}"
            echo "NXT_PP_MACHINES_DIR=${NXT_PP_MACHINES_DIR}"
            echo "NXT_PP_MCH=${NXT_PP_MCH}"
          } >> "${GITHUB_ENV}"
          echo "Build version: ${NXT_BUILD_VERSION}"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: nxt ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.NXT_RELEASE_ZIP }}
            ${{ env.NXT_PP_CPS }}
            ${{ env.NXT_PP_PY }}
            ${{ env.NXT_PP_MACHINE_PY }}
            ${{ env.NXT_PP_MACHINES_DIR }}/*.fcm
            ${{ env.NXT_PP_MCH }}
